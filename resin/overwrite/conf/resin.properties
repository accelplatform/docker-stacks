# resin.properties - configuration variable values
# 
# See resin.xml, cluster-default.xml, and health.xml for full configuration.
# Any variable defined by ${...} can be set as a property in this file.
# 
# Individual server overrides can be specified by prepending the server.id.
# For example, increasing the log level for an individual server:
#
# log_level : info
# app-0.log_level : finest
#
# Like Resin XML configuration, modification of this file will trigger
# a restart.
#

# General log level (modify resin.xml for more granular log level adjustments)
# log_level     : finer

# Enable verbose browser error reporting
# Tuned by NTTDATA INTRAMART
# dev_mode      : true
dev_mode      : false

# How often Resin should check for updated files.
# dependency_check_interval : 5m

# Enable /resin-doc Resin documentation
# Tuned by NTTDATA INTRAMART
# resin_doc      : true
resin_doc      : false
resin_doc_host :

# List Triad server ip-addresses:hmux-port for each tier, space separated
# App tier Triad servers must be listed to enable web-tier to 
# app-tier load-balancing

# web-tier Triad servers: web-0 web-1 web-2
# web_servers      : 127.0.0.1:6810

# app-tier Triad servers: app-0 app-1 app-2
app_servers      : 127.0.0.1:6800

# Allow elastic nodes to join the cluster (enable for cloud mode)
# elastic_cloud_enable : true

# The cluster that elastic nodes should join - each will contact a Triad server
# Use a separate resin.properties file for each cluster
home_cluster : app

# Used for an elastic server to join the cluster in home_cluster
# elastic_server : true

# Create a distinct webapps/ directory for each server, for vertical scaling
# elastic_webapp : true

# Used for cloud servers with dynamic IP addresses where the DNS name for the
# server is assigned after the server starts. Resin will retry the start.
# elastic_dns : true

# specifies the --server in the config file
# home_server : app-0

# Set HTTP and HTTPS bind address
# http_address  : *

# Set HTTP and HTTPS ports.
#   http       - default for all clusters and servers
#   app.http   - default for all servers in cluster 'app'
#   app-0.http - for server 'app-0' only 
# http          : 8080

app.http          : 8080
# app.https         : 8443

web.http          : 8080
# web.https         : 8443

# For security, Resin can switch to a non-root user after binding to port 80
setuid_user   : 
setuid_group  : 

# Arg passed directly to the JVM
# Tuned by NTTDATA INTRAMART
# jvm_args  : -Dfile.encoding=UTF-8 -Xmx4096m
# jvm_mode    : -server
jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx4096m -Xms4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000 --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/sun.util.locale=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp.datatype=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
# jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx8192m -Xms8192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000 --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/sun.util.locale=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp.datatype=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
# When using Java 8 or 11
# jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx4096m -Xms4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000
# jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx8192m -Xms8192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000
# Using Java Flight Recorder with Java 11 or later. If the log directory does not exist, create a log directory.
# jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx4096m -Xms4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -XX:StartFlightRecording=dumponexit=true,filename=log,disk=true,maxage=1d,settings=default -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000
# jvm_args : -Dfile.encoding=UTF-8 -Djava.io.tmpdir=tmp -Xmx8192m -Xms8192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30 -XX:-OmitStackTraceInFastThrow -XX:+HeapDumpOnOutOfMemoryError -XX:StartFlightRecording=dumponexit=true,filename=log,disk=true,maxage=1d,settings=default -Djp.co.intra_mart.system.javascript.Debugger.protocol=dap -Djp.co.intra_mart.system.javascript.Debugger.port=9000
# watchdog_jvm_args  :

# This classpath has priority over the default classpath, like when you want to
# use a third party library like Hibernate's JPA
# jvm_classpath :

# Local URLs for the watchdog to check to ensure the server is up,
# space separated
# http_ping_urls : http://127.0.0.1/test.jsp

# Throttle the number of active threads for a port
# Tuned by NTTDATA INTRAMART
# port_thread_max   : 256
# accept_thread_max : 32
# accept_thread_min : 4
port_thread_max   : 1024
accept_thread_max : 128
accept_thread_min : 32
# keepalive_max   : 512

# Enable JNI TCP speed optimizations
tcp_cork : true
sendfile : true
keepalive_select_enable : true

# OpenSSL certificate configuration
# Keys are typically stored in the resin configuration directory.
# openssl_file : keys/test.crt
# openssl_key : keys/test.key
# openssl_chain_file : keys/test.ca
# openssl_password : changeme
# openssl_protocol : -sslv2 -sslv3
# openssl_cipher_suite :

# JSSE certificate configuration
# Keys are typically stored in the resin configuration directory.
# jsse_keystore_type : jks
# jsse_keystore_file : /etc/resin/keys/server.keystore
# jsse_keystore_password : changeme

# In absence of a signed certificate, Resin will fallback to using a 
# self-signed development certificate if HTTPS is enabled

# Enable the proxy-cache - for caching static content in memory
# Tuned by NTTDATA INTRAMART
# proxy_cache_enable : true
proxy_cache_enable : false

# Sets the proxy cache memory size
# proxy_cache_size : 256m

# Enable clustered persistent sessions (for failover)
session_store : false

# Access log format
access_log_format : %h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i"

# disable the quercus *.php mapping when using Apache for PHP
# quercus_disable : true

# Web-apps named with numeric suffixes, e.g. foo-10.0.war and can be browsed
# as /foo. When a new version of the web-app is deployed, Resin continues
# to route active session requests to the previous web-app version while
# new sessions go to the new version, so users will not be aware of the
# application upgrade.
# webapp_multiversion_routing : true

# Set the email address to receive weekly and restart PDF reports
# email : admin@example.com

pdf_summary : true

# Enable remote admin (for remote CLI and for EC2 ext: triad discovery)
# remote_admin_enable : true

# Enable /resin-admin web administration console
web_admin_enable : true
web_admin_host   :

# Permit access to /resin-admin from non-local network ip-addresses
# web_admin_external : true

# Require HTTPS to access /resin-admin
# web_admin_ssl : true

# Enable Resin REST Admin
# rest_admin_enable : true

# Require SSL for REST Admin
# rest_admin_ssl : true

# Health check disable
# health_disable   : true
# health_log_level : off
# health_log_expire_timeout : 14D

# access to /resin-admin and remote CLI is password restricted.
# Use "resinctl generate-password" and copy/paste here to set the admin
# admin_user : admin
# admin_password : {SSHA}xxxxxxxx

# Enable reading EC2 user data as resin properties
# properties_import_url : http://169.254.169.254/latest/user-data
